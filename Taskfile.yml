version: '3'

tasks:
  build:
    desc: Build the CLI binary for the current platform
    cmds:
      - go build -o bin/windowctl ./cmd/windowctl

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  lint:
    desc: Run go vet across the module
    cmds:
      - go vet ./...

  snapshot:
    desc: Build a snapshot release for all platforms locally (no publish, no tag). Stages binaries into npm/platforms/<os-arch>/bin/ via the per-build post hook.
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  release:dry-run:
    desc: Verbose snapshot release for debugging the goreleaser config.
    cmds:
      - goreleaser release --snapshot --clean --skip=publish --verbose

  local-install:
    desc: "Build + symlink bin/windowctl → /usr/local/bin/windowctl for dev iteration. Each subsequent 'task build' is immediately live."
    deps: [build]
    cmds:
      - bash ./scripts/local-install.sh

  local-uninstall:
    desc: "Remove the dev symlink at /usr/local/bin/windowctl (only if it points at this repo; safe to run even if absent)."
    cmds:
      - bash ./scripts/local-uninstall.sh

  smoke-darwin:
    desc: Run the macOS real-window smoke test (TextEdit via LaunchServices, no AppleScript)
    cmds:
      - bash ./scripts/smoke-darwin.sh

  smoke-darwin-apps:
    desc: "macOS per-app Move/Focus matrix (Chrome, VSCode, etc.). Override with APPS=\"Google Chrome\""
    cmds:
      - bash ./scripts/smoke-darwin-apps.sh

  smoke-windows:
    desc: Run the Windows real-window smoke test (Notepad)
    cmds:
      - pwsh ./scripts/smoke-windows.ps1

  smoke-wayland:
    desc: Run the Wayland (KDE Plasma) real-window smoke test — local-only, requires a KDE Wayland session with spectacle installed
    cmds:
      - bash ./scripts/smoke-wayland.sh

  smoke-wayland-gnome:
    desc: Run the Wayland (GNOME) real-window smoke test — local GNOME Wayland session, or a VM via WCTL_SMOKE_SSH=user@host
    cmds:
      - bash ./scripts/smoke-wayland-gnome.sh

  smoke-wayland-sway:
    desc: Run the Wayland (sway) real-window smoke test — local sway session, or a VM via WCTL_SMOKE_SSH=user@host
    cmds:
      - bash ./scripts/smoke-wayland-sway.sh

  npm:bump:
    desc: "Sync npm package versions across main + 5 platform sub-packages. Usage: task npm:bump -- 0.2.0"
    cmds:
      - node scripts/bump-npm-version.js {{.CLI_ARGS}}

  npm:publish:
    desc: "Publish all 6 @muthuishere/windowctl* packages to npm (sub-packages first, then main). Non-interactive — token must be configured."
    cmds:
      - bash scripts/publish-npm-local.sh

  release:
    desc: "Full local release: bump → goreleaser snapshot → publish 6 npm packages → commit → tag → push → GH release. Usage: task release -- 0.2.0"
    cmds:
      - bash scripts/release-local.sh {{.CLI_ARGS}}
