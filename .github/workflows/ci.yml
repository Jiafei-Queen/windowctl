name: CI

# What CI can verify (and deliberately cannot): pure-Go unit tests,
# static analysis, and script/JS syntax gates. Real-window validation
# (task smoke-wayland*) needs a live compositor and stays local-only —
# docs/specs/10-ci-test-matrix.md forbids Docker for window tests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # The linux adapter (wayland backends included) is behind
    # //go:build linux, so lint and tests must run on linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test (fresh, race)
        run: go test -count=1 -race ./...

      - name: shellcheck
        # Preinstalled on ubuntu runners.
        run: shellcheck -S warning scripts/*.sh

      - name: node syntax check (GNOME extension)
        run: node --check internal/adapter/linux/wayland/gnome/extension/extension.js
