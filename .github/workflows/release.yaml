name: Release

# Builds the five release targets with goreleaser and attaches the archives to
# a GitHub release. Triggered by pushing a version tag; `task snapshot` is the
# local dry run.
#
# npm publishing (the OIDC trusted-publishing path of ADR 0013) is not part of
# this fork: releases ship as GitHub release assets, and the library itself is
# consumed with `go get` / `go install`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (bare semver, no leading v)'
        required: true

permissions:
  contents: write   # create the GitHub release

jobs:
  release:
    # macOS, not ubuntu: the darwin build needs CGO against CoreGraphics /
    # ApplicationServices, and a macOS host's clang cross-compiles the
    # CGO-free linux + windows targets happily. The reverse is not true —
    # building darwin from ubuntu would need osxcross.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser derives the version from tags

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      - run: go test ./...

      # Builds all 5 targets. The per-build post hooks also stage each binary
      # into npm/platforms/<os>-<arch>/bin/, which no release consumes today
      # but keeps the npm packaging ready if it is ever published.
      # --skip=publish because this workflow creates the GitHub release itself
      # (the goreleaser config's release target predates the repo move).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes
