name: Release

# Publishes to npm with OIDC trusted publishing — no NPM_TOKEN, no `npm login`.
# Triggered by pushing a version tag; the local `task release` path stays as a
# fallback but is no longer the only way to ship (ADR 0013).
#
# ONE-TIME MANUAL SETUP (cannot be done from here — npmjs.com UI only):
# for each of the 6 packages, Settings → Publishing access → Trusted publisher:
#   Repository: <owner>/windowctl (this repo)
#   Workflow:   release.yaml
# Packages: @muthuishere/windowctl and @muthuishere/windowctl-{darwin-arm64,
# darwin-x64,linux-arm64,linux-x64,windows-x64}.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (bare semver, no leading v)'
        required: true

permissions:
  contents: write   # create the GitHub release
  id-token: write   # mint the OIDC token npm exchanges for publish rights

jobs:
  release:
    # macOS, not ubuntu: the darwin build needs CGO against CoreGraphics /
    # ApplicationServices, and a macOS host's clang cross-compiles the
    # CGO-free linux + windows targets happily. The reverse is not true —
    # building darwin from ubuntu would need osxcross.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser derives the version from tags

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing $V"

      - run: go test ./...

      - name: Sync npm package versions
        run: node scripts/bump-npm-version.js "${{ steps.v.outputs.version }}"

      # Builds all 5 targets and stages each binary into
      # npm/platforms/<os>-<arch>/bin/ via the per-build post hooks.
      # --skip=publish because this workflow creates the GitHub release itself
      # (the goreleaser config's release target predates the repo move).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --skip=publish

      - name: Verify all 5 binaries staged
        run: |
          set -e
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            test -s "npm/platforms/$p/bin/windowctl" || { echo "missing $p"; exit 1; }
          done
          test -s npm/platforms/windows-x64/bin/windowctl.exe || { echo "missing windows-x64"; exit 1; }
          echo "all 5 staged"

      # No token anywhere: npm exchanges the Actions OIDC token for short-lived
      # publish rights against the trusted publisher configured on npmjs.com.
      #
      # Provenance is disabled deliberately. npm enables it by default under
      # trusted publishing, but generating a provenance attestation requires a
      # PUBLIC source repository, and this repo is private — leaving it on makes
      # every publish fail. Flip this to true if the repo is ever made public.
      - name: Publish to npm (OIDC)
        env:
          NPM_CONFIG_PROVENANCE: false
        run: |
          set -e
          for dir in \
            npm/platforms/darwin-arm64 \
            npm/platforms/darwin-x64 \
            npm/platforms/linux-arm64 \
            npm/platforms/linux-x64 \
            npm/platforms/windows-x64 \
            npm
          do
            echo "=== publishing $dir ==="
            (cd "$dir" && npm publish --access public)
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes

      # The version bump is a real file change; land it so the repo and the
      # published packages agree.
      - name: Commit the version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npm/package.json npm/platforms/*/package.json
          if git diff --staged --quiet; then
            echo "already at ${{ steps.v.outputs.version }}"
          else
            git commit -m "release: v${{ steps.v.outputs.version }}"
            git push origin HEAD:main
          fi
